  <!-- L4: evidence-native writing -->
  <rect x="60" y="672" width="1360" height="216" rx="8" fill="#FFF0ED" stroke="#F0B7AC" class="lane"/>
  <rect x="60" y="672" width="8" height="216" fill="#D85B45"/>
  <text x="86" y="701" class="band-title" fill="#B74232">L4 · Evidence-native E+ 写作与质量诊断</text>
  <text x="86" y="722" class="band-sub">章节并行、全篇串行；报告 Claim 逐条回到指定 Evidence 核验，自动诊断不取代人工判断</text>

  <rect x="145" y="748" width="180" height="70" class="box" stroke="#E99888"/>
  <text x="235" y="773" text-anchor="middle" class="box-title">Blueprint + Context</text>
  <text x="235" y="794" text-anchor="middle" class="box-sub">确定性章节选材</text>

  <rect x="350" y="748" width="180" height="70" class="box" stroke="#E99888"/>
  <text x="440" y="773" text-anchor="middle" class="box-title">Section Writers</text>
  <text x="440" y="794" text-anchor="middle" class="box-sub">分章并发写作</text>

  <rect x="555" y="748" width="180" height="70" class="box" stroke="#E99888"/>
  <text x="645" y="773" text-anchor="middle" class="box-title">Prevalidation</text>
  <text x="645" y="794" text-anchor="middle" class="box-sub">最小 cited span</text>

  <rect x="760" y="748" width="185" height="70" class="box" stroke="#E99888"/>
  <text x="852" y="773" text-anchor="middle" class="box-title">Editorial Claim Bank</text>
  <text x="852" y="794" text-anchor="middle" class="box-sub">通过声明白名单</text>

  <rect x="970" y="748" width="170" height="70" class="box" stroke="#E99888"/>
  <text x="1055" y="773" text-anchor="middle" class="box-title">Serial Editorial</text>
  <text x="1055" y="794" text-anchor="middle" class="box-sub">摘要与综合结论</text>

  <rect x="1165" y="748" width="205" height="70" class="box" stroke="#DF7462"/>
  <text x="1267" y="773" text-anchor="middle" class="box-title">Final Validation</text>
  <text x="1267" y="793" text-anchor="middle" class="tiny">Citation / Atomic Entailment</text>
  <text x="1267" y="808" text-anchor="middle" class="tiny">Critic / Quality Gate</text>

