  <text x="86" y="964" class="band-sub">Markdown / Manifest 是长期正本，LightRAG 是按 ResearchItem 独立构建、可重建的派生索引</text>

  <rect x="190" y="978" width="180" height="52" class="box" stroke="#70BD8D"/>
  <text x="280" y="1000" text-anchor="middle" class="box-title">HITL #2 · 用户审核</text>
  <text x="280" y="1019" text-anchor="middle" class="box-sub">接受 / 暂缓 / 补研</text>

  <rect x="395" y="978" width="180" height="52" class="box" stroke="#70BD8D"/>
  <text x="485" y="1000" text-anchor="middle" class="box-title">Archive Preview</text>
  <text x="485" y="1019" text-anchor="middle" class="box-sub">Confirm + 文件域提交</text>

  <rect x="600" y="978" width="190" height="52" class="box" stroke="#4FAE75"/>
  <text x="695" y="1000" text-anchor="middle" class="box-title">ResearchItem</text>
  <text x="695" y="1019" text-anchor="middle" class="box-sub">Markdown + Manifest 正本</text>

  <rect x="815" y="978" width="180" height="52" class="box" stroke="#70BD8D"/>
  <text x="905" y="1000" text-anchor="middle" class="box-title">独立 LightRAG</text>
  <text x="905" y="1019" text-anchor="middle" class="box-sub">异步派生索引</text>

  <rect x="1020" y="978" width="180" height="52" class="box" stroke="#70BD8D"/>
  <text x="1110" y="1000" text-anchor="middle" class="box-title">KnowledgeScope QA</text>
  <text x="1110" y="1019" text-anchor="middle" class="box-sub">多 Item 聚合与引用</text>

  <rect x="1225" y="978" width="165" height="52" class="box" stroke="#70BD8D"/>
  <text x="1307" y="1000" text-anchor="middle" class="box-title">飞书知识卡</text>
  <text x="1307" y="1019" text-anchor="middle" class="box-sub">配置化推送</text>

