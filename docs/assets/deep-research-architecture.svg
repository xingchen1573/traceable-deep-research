  <rect x="1450" y="436" width="290" height="610" rx="8" fill="#F2F4F7" stroke="#C8CED8" class="lane"/>
  <rect x="1450" y="436" width="8" height="610" fill="#586579"/>
  <text x="1476" y="465" class="band-title" fill="#344054">横切层 · 运行与审计</text>
  <text x="1476" y="487" class="band-sub">记录执行事实，不绕过内容合同</text>

  <rect x="1478" y="515" width="234" height="74" class="box" stroke="#AEB6C3"/>
