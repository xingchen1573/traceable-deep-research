  <path d="M530 783 H547" class="arrow"/>
  <path d="M735 783 H752" class="arrow"/>
  <path d="M945 783 H962" class="arrow"/>
  <path d="M1140 783 H1157" class="arrow"/>

  <rect x="350" y="838" width="720" height="30" rx="6" fill="#FFF8F6" stroke="#F0B7AC"/>
  <text x="710" y="858" text-anchor="middle" class="tiny" fill="#A43F31">输出 complete / partial / warning / [待核实]；当前默认不由 Critic 驱动 Writer 无限返修</text>
  <path d="M1275 818 V852 H1080" class="arrow"/>

  <!-- L5: knowledge asset and reuse -->
  <rect x="60" y="914" width="1360" height="132" rx="8" fill="#ECF8EF" stroke="#AED9BC" class="lane"/>
  <rect x="60" y="914" width="8" height="132" fill="#168A52"/>
