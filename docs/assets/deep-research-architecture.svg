  <text x="60" y="1080" class="tiny">实线：默认主链　　虚线：反馈、条件或派生关系　　事实权威：可回溯 Quote；Claim 用于语义路由、覆盖判断与成文声明校验</text>
  <text x="1740" y="1080" text-anchor="end" class="tiny">Push Scheduler 当前为进程内可选能力，默认关闭；不是 FSRS 自适应复习</text>
