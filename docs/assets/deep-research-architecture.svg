<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">Deep Research 证据驱动多 Agent 学习系统架构</title>
  <desc id="diagram-desc">从 Web、CLI 主 Agent 与飞书进入，经计划确认、共享多轮检索、Evidence-native 写作、人工归档，最终形成可问答和可推送的 ResearchItem 知识资产；单 URL 简报为独立短链。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#667085"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/>
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#C66A00"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#168A52"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 34px; font-weight: 750; }
      .subtitle { font-size: 16px; fill: #667085; }
      .eyebrow { font-size: 13px; font-weight: 700; fill: #475467; }
      .band-title { font-size: 19px; font-weight: 750; }
      .band-sub { font-size: 12px; fill: #667085; }
      .box-title { font-size: 15px; font-weight: 700; }
      .box-sub { font-size: 12px; fill: #667085; }
      .tiny { font-size: 11px; fill: #667085; }
      .lane { stroke-width: 1.3; }
      .box { fill: #FFFFFF; stroke-width: 1.25; rx: 8; }
      .connector { fill: none; stroke: #667085; stroke-width: 1.7; }
      .arrow { fill: none; stroke: #667085; stroke-width: 1.7; marker-end: url(#arrow); }
      .feedback { fill: none; stroke-width: 1.6; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#F7F8FA"/>

  <text x="60" y="52" class="title">Deep Research · 证据驱动多 Agent 学习系统</text>
  <text x="60" y="82" class="subtitle">Plan-first 约束执行 · Job 级共享检索 · Claim–Quote 双层 Evidence · Evidence-native 写作 · 人工归档与长期复用</text>
  <text x="1740" y="50" text-anchor="end" class="eyebrow">SYSTEM ARCHITECTURE</text>
  <text x="1740" y="76" text-anchor="end" class="tiny">当前默认主链与边界</text>

  <!-- L1: entry and routing -->
  <rect x="60" y="108" width="1680" height="102" rx="8" fill="#EEF2FF" stroke="#C7D2FE" class="lane"/>
  <rect x="60" y="108" width="8" height="102" fill="#4F46E5"/>
  <text x="86" y="137" class="band-title" fill="#3730A3">L1 · 接入与任务分流</text>
  <text x="86" y="161" class="band-sub">Web / CLI / 飞书复用领域服务</text>
  <text x="86" y="180" class="band-sub">深度调研与单 URL 明确分流</text>

  <rect x="300" y="131" width="142" height="52" class="box" stroke="#A5B4FC"/>
  <text x="371" y="153" text-anchor="middle" class="box-title">Web</text>
  <text x="371" y="171" text-anchor="middle" class="box-sub">Research Studio</text>

  <rect x="470" y="131" width="170" height="52" class="box" stroke="#A5B4FC"/>
  <text x="555" y="153" text-anchor="middle" class="box-title">CLI 主 Agent</text>
  <text x="555" y="171" text-anchor="middle" class="box-sub">意图理解与工具派发</text>

  <rect x="668" y="131" width="142" height="52" class="box" stroke="#A5B4FC"/>
  <text x="739" y="153" text-anchor="middle" class="box-title">飞书</text>
  <text x="739" y="171" text-anchor="middle" class="box-sub">WS Worker</text>

  <path d="M371 183 V197 H830" class="connector"/>
  <path d="M555 183 V197 H830" class="connector"/>
  <path d="M739 183 V197 H830" class="connector"/>
  <path d="M830 197 V157 H842" class="arrow"/>
  <rect x="850" y="128" width="238" height="58" class="box" stroke="#818CF8"/>
  <text x="969" y="151" text-anchor="middle" class="box-title">Request Router</text>
  <text x="969" y="172" text-anchor="middle" class="box-sub">问答 / 多源调研 / 单 URL</text>

  <path d="M1088 157 H1230" class="arrow"/>
  <rect x="1238" y="128" width="245" height="58" class="box" stroke="#A5B4FC"/>
  <text x="1360" y="151" text-anchor="middle" class="box-title">普通问答 / KB QA</text>
  <text x="1360" y="172" text-anchor="middle" class="box-sub">限定 KnowledgeScope</text>

  <!-- L2: plan-first -->
  <rect x="60" y="236" width="1360" height="132" rx="8" fill="#E9F8F4" stroke="#A7DED0" class="lane"/>
  <rect x="60" y="236" width="8" height="132" fill="#0F8A79"/>
  <text x="86" y="265" class="band-title" fill="#0F766E">L2 · Plan-first 研究合同</text>
  <text x="86" y="286" class="band-sub">先消除范围歧义，再让用户确认结构化计划；确认后的 authored_plan 直接驱动后台 Job</text>

  <rect x="250" y="292" width="185" height="52" class="box" stroke="#72C7B5"/>
  <text x="342" y="314" text-anchor="middle" class="box-title">轻量概念澄清</text>
  <text x="342" y="333" text-anchor="middle" class="box-sub">Recon Context</text>

  <rect x="470" y="292" width="205" height="52" class="box" stroke="#72C7B5"/>
  <text x="572" y="314" text-anchor="middle" class="box-title">Planning Service</text>
  <text x="572" y="333" text-anchor="middle" class="box-sub">一次结构化模型调用</text>

  <rect x="710" y="292" width="195" height="52" class="box" stroke="#72C7B5"/>
  <text x="807" y="314" text-anchor="middle" class="box-title">计划局部编辑</text>
  <text x="807" y="333" text-anchor="middle" class="box-sub">keep / redo / add</text>

  <rect x="940" y="292" width="205" height="52" class="box" stroke="#40A994"/>
  <text x="1042" y="314" text-anchor="middle" class="box-title">HITL #1 · 计划确认</text>
  <text x="1042" y="333" text-anchor="middle" class="box-sub">规范化 + 完整性 Token</text>

  <rect x="1180" y="292" width="190" height="52" class="box" stroke="#40A994"/>
  <text x="1275" y="314" text-anchor="middle" class="box-title">authored_plan</text>
  <text x="1275" y="333" text-anchor="middle" class="box-sub">后台执行合同</text>

  <path d="M435 318 H462" class="arrow"/>
  <path d="M675 318 H702" class="arrow"/>
  <path d="M905 318 H932" class="arrow"/>
  <path d="M1145 318 H1172" class="arrow"/>
  <path d="M1042 292 C1042 270 807 270 807 286" class="feedback" stroke="#0F8A79" marker-end="url(#arrow)"/>
  <text x="916" y="278" text-anchor="middle" class="tiny" fill="#0F766E">修改意见</text>

  <!-- single URL branch -->
  <rect x="1450" y="236" width="290" height="174" rx="8" fill="#F4F0FF" stroke="#CFC3F4" class="lane"/>
  <rect x="1450" y="236" width="8" height="174" fill="#7657C8"/>
  <text x="1476" y="265" class="band-title" fill="#6546B8">独立短链 · Single URL</text>
  <rect x="1478" y="286" width="234" height="64" class="box" stroke="#B9A8EA"/>
  <text x="1595" y="309" text-anchor="middle" class="box-title">抓取 → 提炼 → 快速简报</text>
  <text x="1595" y="332" text-anchor="middle" class="box-sub">绕过 Plan / Coverage / E+</text>
  <text x="1595" y="378" text-anchor="middle" class="box-sub">直接交付；另行确认后才保存</text>
  <path d="M1080 186 V220 H1435 V318 H1470" class="feedback" stroke="#7657C8" marker-end="url(#arrow)"/>

  <!-- L3: research loop -->
  <rect x="60" y="394" width="1360" height="252" rx="8" fill="#FFF7E8" stroke="#F0CF94" class="lane"/>
  <rect x="60" y="394" width="8" height="252" fill="#D97706"/>
  <text x="86" y="423" class="band-title" fill="#B45309">L3 · Job 级共享多轮检索</text>
  <text x="86" y="444" class="band-sub">共享 Source / Material，问题级独立消费；Coverage 缺口和预算共同决定补查或停止</text>

  <rect x="170" y="463" width="210" height="58" class="box" stroke="#E8B85F"/>
  <text x="275" y="486" text-anchor="middle" class="box-title">Question Orchestrator</text>
  <text x="275" y="507" text-anchor="middle" class="box-sub">有界问题级 Workers</text>

  <rect x="410" y="463" width="165" height="58" class="box" stroke="#E8B85F"/>
  <text x="492" y="486" text-anchor="middle" class="box-title">Gap Query</text>
  <text x="492" y="507" text-anchor="middle" class="box-sub">来源发现</text>

  <rect x="605" y="463" width="210" height="58" class="box" stroke="#E8B85F"/>
  <text x="710" y="486" text-anchor="middle" class="box-title">任务级 Global Source Pool</text>
  <text x="710" y="507" text-anchor="middle" class="box-sub">URL 规范化 / 去重 / 选择</text>

  <rect x="845" y="463" width="210" height="58" class="box" stroke="#E8B85F"/>
  <text x="950" y="486" text-anchor="middle" class="box-title">Fetch Chain + Material</text>
  <text x="950" y="507" text-anchor="middle" class="box-sub">任务内唯一抓取与正文共享</text>

  <rect x="1085" y="463" width="245" height="58" class="box" stroke="#E8B85F"/>
  <text x="1207" y="486" text-anchor="middle" class="box-title">Chunk + Hybrid Ranker</text>
  <text x="1207" y="507" text-anchor="middle" class="box-sub">词法 / Embedding / RRF / 来源分散</text>

  <path d="M380 492 H402" class="arrow"/>
  <path d="M575 492 H597" class="arrow"/>
  <path d="M815 492 H837" class="arrow"/>
  <path d="M1055 492 H1077" class="arrow"/>

  <rect x="1025" y="548" width="305" height="62" class="box" stroke="#DFA448"/>
  <text x="1177" y="571" text-anchor="middle" class="box-title">Evidence · Atomic Claim + Quote</text>
  <text x="1177" y="592" text-anchor="middle" class="box-sub">Grounding / Subject / Axis / Criterion 准入</text>
  <path d="M1207 521 V540" class="arrow"/>

  <rect x="730" y="548" width="250" height="62" class="box" stroke="#DFA448"/>
  <text x="855" y="571" text-anchor="middle" class="box-title">Coverage Judge</text>
  <text x="855" y="592" text-anchor="middle" class="box-sub">硬 / 软 Criterion 与新颖性</text>
  <path d="M1025 579 H988" class="arrow"/>

  <rect x="430" y="548" width="255" height="62" class="box" stroke="#DFA448"/>
  <text x="557" y="571" text-anchor="middle" class="box-title">Question State</text>
  <text x="557" y="592" text-anchor="middle" class="box-sub">complete / partial / exhausted</text>
  <path d="M730 579 H693" class="arrow"/>

  <rect x="170" y="548" width="215" height="62" class="box" stroke="#E8B85F"/>
  <text x="277" y="571" text-anchor="middle" class="box-title">比较任务（条件分支）</text>
  <text x="277" y="592" text-anchor="middle" class="box-sub">Subject × Axis Matrix</text>
  <path d="M277 548 V536 H855 V540" class="arrow"/>

  <path d="M855 610 V630 H492 V529" class="feedback" stroke="#C66A00" marker-end="url(#arrow-amber)"/>
