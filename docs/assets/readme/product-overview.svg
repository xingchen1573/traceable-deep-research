<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Deep Research 产品工作流预览</title>
  <desc id="hero-desc">从计划确认开始，以可回溯的证据完成调研写作，经人工归档后形成可问答并可推送复习的知识资产。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#241C15" flood-opacity="0.10"/>
    </filter>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#241C15" flood-opacity="0.08"/>
    </filter>
    <marker id="thread-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C4531E"/>
    </marker>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #241C15; }
      .display { font-family: Georgia, "Songti SC", "STSong", serif; font-weight: 700; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; letter-spacing: 0.09em; }
      .muted { fill: #8A7D6C; }
      .faint { fill: #B7AB98; }
      .copper { fill: #C4531E; }
      .green { fill: #4E7A4A; }
      .teal { fill: #0F766E; }
      .hairline { stroke: #E4D9C6; stroke-width: 2; }
      .panel { fill: #FFFDF8; stroke: #D9CCB8; stroke-width: 2; }
      .label { font-size: 20px; font-weight: 700; }
      .body { font-size: 22px; }
      .small { font-size: 18px; }
      .tiny { font-size: 17px; }
      text[fill="#FFFDF8"] { fill: #FFFDF8; }
      text[fill="#D8CDBD"] { fill: #D8CDBD; }
      text[fill="#CBE6E0"] { fill: #CBE6E0; }
    </style>
  </defs>

  <rect x="1" y="1" width="1598" height="898" rx="34" fill="#F6F1E9" stroke="#E4D9C6" stroke-width="2"/>
  <circle cx="1440" cy="90" r="164" fill="#E9F4EF"/>
  <circle cx="1515" cy="170" r="104" fill="#F7DDCF" opacity="0.72"/>

  <g transform="translate(64 54)">
    <text class="mono copper" x="0" y="18" font-size="18" font-weight="700">EVIDENCE → KNOWLEDGE</text>
    <text class="display" x="0" y="82" font-size="50">一次调研，成为持续生长的知识资产</text>
    <text class="muted" x="0" y="126" font-size="23">计划先行 · 证据约束写作 · 人工确认归档 · 限定范围问答与复习</text>
  </g>

  <g transform="translate(1294 55)">
    <rect width="238" height="54" rx="27" fill="#FFFDF8" stroke="#D9CCB8" stroke-width="2"/>
    <circle cx="27" cy="27" r="7" fill="#4E7A4A"/>
    <text x="45" y="34" class="mono green" font-size="17" font-weight="700">HUMAN APPROVED</text>
  </g>

  <!-- Research plan window -->
  <g transform="translate(64 222)" filter="url(#soft-shadow)">
    <rect width="410" height="522" rx="18" class="panel"/>
    <rect width="410" height="62" rx="18" fill="#241C15"/>
    <rect y="42" width="410" height="20" fill="#241C15"/>
    <circle cx="28" cy="30" r="6" fill="#C4531E"/>
    <text x="48" y="37" fill="#FFFDF8" font-size="20" font-weight="700">调研计划</text>
    <text x="290" y="36" fill="#D8CDBD" class="mono" font-size="16">PLAN FIRST</text>

    <text x="28" y="104" class="mono muted" font-size="16">RESEARCH QUESTION</text>
    <text x="28" y="139" class="display" font-size="25">多 Agent 协作中的</text>
    <text x="28" y="171" class="display" font-size="25">共享状态一致性</text>
    <line x1="28" y1="197" x2="382" y2="197" class="hairline"/>

    <g transform="translate(28 226)">
      <circle cx="13" cy="12" r="12" fill="#F7DDCF"/>
      <text x="13" y="18" text-anchor="middle" class="copper" font-size="16" font-weight="700">1</text>
      <text x="42" y="19" class="label">状态与一致性模型</text>
      <text x="42" y="47" class="small muted">定义冲突、顺序与失败边界</text>
    </g>
    <g transform="translate(28 300)">
      <circle cx="13" cy="12" r="12" fill="#F7DDCF"/>
      <text x="13" y="18" text-anchor="middle" class="copper" font-size="16" font-weight="700">2</text>
      <text x="42" y="19" class="label">消息去重与并发控制</text>
      <text x="42" y="47" class="small muted">幂等键、CAS 与补偿机制</text>
    </g>
    <g transform="translate(28 374)">
      <circle cx="13" cy="12" r="12" fill="#F7DDCF"/>
      <text x="13" y="18" text-anchor="middle" class="copper" font-size="16" font-weight="700">3</text>
      <text x="42" y="19" class="label">切回确定性工作流</text>
      <text x="42" y="47" class="small muted">识别 Agent 不再适合的条件</text>
    </g>

    <rect x="28" y="456" width="354" height="45" rx="10" fill="#C4531E"/>
    <text x="205" y="485" text-anchor="middle" fill="#FFFDF8" font-size="18" font-weight="700">确认计划并开始调研</text>
  </g>

  <!-- Evidence reader window, the dominant artifact -->
  <g transform="translate(420 268)" filter="url(#shadow)">
    <rect width="744" height="538" rx="20" class="panel"/>
    <rect width="744" height="66" rx="20" fill="#FFFDF8"/>
    <rect y="48" width="744" height="18" fill="#FFFDF8"/>
    <circle cx="28" cy="31" r="6" fill="#C4531E"/>
    <circle cx="50" cy="31" r="6" fill="#E4D9C6"/>
    <circle cx="72" cy="31" r="6" fill="#E4D9C6"/>
    <text x="104" y="38" class="label">证据阅读版</text>
    <rect x="580" y="18" width="134" height="30" rx="15" fill="#E9F4EF"/>
    <circle cx="600" cy="33" r="5" fill="#4E7A4A"/>
    <text x="614" y="39" class="green" font-size="16" font-weight="700">验证通过</text>
    <line x1="0" y1="66" x2="744" y2="66" class="hairline"/>

    <g transform="translate(38 102)">
      <text class="mono copper" font-size="16">REPORT / 02</text>
      <text class="display" x="0" y="48" font-size="29">幂等、冲突与补偿</text>
      <text class="display" x="0" y="82" font-size="29">共享状态的可靠边界</text>
      <text class="muted" x="0" y="112" font-size="18">一次可追溯的 ResearchItem · 4 份文档</text>

      <rect x="0" y="137" width="429" height="2" fill="#E4D9C6"/>
      <text x="0" y="175" class="body">每个写操作先携带稳定的幂等键，再使用</text>
      <text x="0" y="209" class="body">版本号或 CAS 检测并发冲突。</text>
      <rect x="327" y="182" width="54" height="34" rx="7" fill="#F7DDCF"/>
      <text x="354" y="206" text-anchor="middle" class="copper" font-size="18" font-weight="700">[12]</text>

      <text x="0" y="262" class="body">跨服务部分失败时，补偿动作必须保留原操作</text>
      <text x="0" y="296" class="body">身份，并允许安全重试。</text>
      <rect x="274" y="269" width="54" height="34" rx="7" fill="#DCEFEB"/>
      <text x="301" y="293" text-anchor="middle" class="teal" font-size="18" font-weight="700">[18]</text>

      <rect x="0" y="329" width="429" height="73" rx="12" fill="#F6F1E9"/>
      <rect x="0" y="329" width="5" height="73" rx="3" fill="#C4531E"/>
      <text x="20" y="356" class="mono copper" font-size="16">CLAIM → QUOTE</text>
      <text x="20" y="385" class="small">结论与原始摘录保持可检查绑定</text>
    </g>

    <g transform="translate(506 102)">
      <text class="mono muted" font-size="16">EVIDENCE MARGIN</text>
      <rect x="0" y="28" width="200" height="145" rx="12" fill="#FFF7F1" stroke="#EAB89C" stroke-width="2"/>
      <text x="18" y="59" class="copper" font-size="18" font-weight="700">[12] 原始证据</text>
      <text x="18" y="89" class="small">“写入方必须复用同一</text>
      <text x="18" y="116" class="small">请求标识，使重复提交</text>
      <text x="18" y="143" class="small">产生相同结果……”</text>

      <rect x="0" y="190" width="200" height="106" rx="12" fill="#EEF8F5" stroke="#9DD4C9" stroke-width="2"/>
      <text x="18" y="221" class="teal" font-size="18" font-weight="700">[18] 来源定位</text>
      <text x="18" y="253" class="small">官方文档 · § 4.2</text>
      <text x="18" y="279" class="tiny muted">点击引用高亮原文</text>

      <g transform="translate(0 330)">
        <rect width="200" height="68" rx="12" fill="#E9F4EF"/>
        <circle cx="24" cy="34" r="8" fill="#4E7A4A"/>
        <text x="44" y="30" class="green" font-size="17" font-weight="700">COVERAGE</text>
        <text x="44" y="51" class="small">核心问题已覆盖</text>
      </g>
    </g>
  </g>

  <!-- Knowledge reuse window -->
  <g transform="translate(1112 202)" filter="url(#soft-shadow)">
    <rect width="424" height="532" rx="18" class="panel"/>
    <rect width="424" height="62" rx="18" fill="#0F766E"/>
    <rect y="42" width="424" height="20" fill="#0F766E"/>
    <text x="26" y="38" fill="#FFFDF8" font-size="20" font-weight="700">知识工作台</text>
    <text x="310" y="37" fill="#CBE6E0" class="mono" font-size="16">REUSE</text>

    <g transform="translate(24 90)">
      <text class="mono muted" font-size="16">KNOWLEDGE TREE</text>
      <rect y="25" width="376" height="142" rx="12" fill="#F6F1E9"/>
      <text x="18" y="57" font-size="18" font-weight="700">▾ Agent 系统</text>
      <text x="43" y="88" class="small">▾ 多 Agent 与协作</text>
      <rect x="38" y="101" width="320" height="48" rx="9" fill="#FFFDF8" stroke="#C4531E" stroke-width="2"/>
      <text x="56" y="132" font-size="18" font-weight="700">共享状态一致性</text>
      <circle cx="338" cy="125" r="6" fill="#4E7A4A"/>
    </g>

    <g transform="translate(24 285)">
      <text class="mono muted" font-size="16">SCOPE QA</text>
      <text x="0" y="40" class="body">什么时候应切回确定性</text>
      <text x="0" y="71" class="body">workflow？</text>
      <rect y="92" width="376" height="83" rx="12" fill="#EEF8F5"/>
      <text x="18" y="123" class="small">当执行顺序必须完全可预测，或</text>
      <text x="18" y="151" class="small">补偿成本高于自主决策收益时。</text>
      <text x="18" y="190" class="teal" font-size="17" font-weight="700">4 条引用 · 限定 Theme</text>
    </g>

    <g transform="translate(24 508)">
      <rect width="376" height="18" rx="9" fill="#E4D9C6"/>
      <rect width="292" height="18" rx="9" fill="#4E7A4A"/>
      <text x="0" y="-10" class="mono green" font-size="16">INDEX READY</text>
    </g>
  </g>

  <!-- The signature evidence thread -->
  <path d="M382 770 C500 842 694 852 820 823 C986 786 1088 784 1238 782 C1362 781 1457 810 1508 842" fill="none" stroke="#C4531E" stroke-width="5" stroke-linecap="round" marker-end="url(#thread-arrow)"/>
  <g>
    <circle cx="382" cy="770" r="17" fill="#C4531E"/>
    <text x="382" y="777" text-anchor="middle" fill="#FFFDF8" font-size="17" font-weight="700">1</text>
    <circle cx="820" cy="823" r="17" fill="#C4531E"/>
    <text x="820" y="830" text-anchor="middle" fill="#FFFDF8" font-size="17" font-weight="700">2</text>
    <circle cx="1238" cy="782" r="17" fill="#C4531E"/>
    <text x="1238" y="789" text-anchor="middle" fill="#FFFDF8" font-size="17" font-weight="700">3</text>
  </g>
  <g transform="translate(73 836)">
    <text class="mono copper" font-size="16" font-weight="700">THE EVIDENCE THREAD</text>
    <text x="242" y="0" class="muted" font-size="18">从问题、引用到知识复用，每一步都保留可检查的上下文</text>
  </g>
</svg>
